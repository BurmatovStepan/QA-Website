{% load custom_tags %}
{% if field.label %}
  <label for="{{ field.id_for_label }}"
         class="form__field-label
         {% if field|is_required %} form__field-label--required{% endif %}"
  >{{ field.label }}</label>
{% endif %}

<div class="form__row">
  {% if field.field.widget.input_type %}
    <input type="{{ field.field.widget.input_type }}"
          name="{{ field.name }}"

          id="{{ field.id_for_label }}"
          class="form__{{ field.name }}"

          value="{{ field.value|default_if_none:"" }}"

          {% for attribute_name, attribute_value in field.field.widget.attrs.items %}
            {{ attribute_name }}="{{ attribute_value }}"
          {% endfor %}
          {% if field|is_required %}required{% endif %}
    >
  {% else %}
    <textarea name="{{ field.name }}"

              id="{{ field.id_for_label }}"
              class="form__{{ field.name }}"

              {% for attribute_name, attribute_value in field.field.widget.attrs.items %}
                {{ attribute_name }}="{{ attribute_value }}"
              {% endfor %}
              {% if field|is_required %}required{% endif %}
    >{{ field.value|default_if_none:"" }}</textarea>
  {% endif %}

  <div class="form__error-wrapper">
    {% for error in field.errors %}
      <span class="form__error-message">{{ error }}</span>
    {% endfor %}
  </div>
</div>
